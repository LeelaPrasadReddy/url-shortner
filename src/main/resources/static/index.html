<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            color: #222;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .card {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        a {
            color: #2563eb;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>URL Shortener</h1>

<div class="card">
    <h2>Shorten a URL</h2>

    <form id="shortenForm">
        <input
            id="urlInput"
            type="url"
            placeholder="https://example.com"
            required
        >

        <button type="submit">Shorten</button>
    </form>

    <div id="message"></div>
</div>

<div class="card">
    <h2>All Shortened URLs</h2>

    <button onclick="loadUrls()">Refresh URLs</button>

    <table>
        <thead>
        <tr>
            <th>Original URL</th>
            <th>Short URL</th>
            <th>Clicks</th>
            <th>Analytics</th>
        </tr>
        </thead>

        <tbody id="urlTable"></tbody>
    </table>
</div>

<script>
    const form = document.getElementById("shortenForm");
    const message = document.getElementById("message");
    const urlTable = document.getElementById("urlTable");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const url = document.getElementById("urlInput").value;

        const response = await fetch("/api/shorten", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (response.ok) {
            message.innerHTML =
                `Short URL: <a href="${data.shortUrl}" target="_blank">
                    ${data.shortUrl}
                </a>`;

            document.getElementById("urlInput").value = "";
            loadUrls();
        } else {
            message.textContent = data.error || "Something went wrong";
        }
    });

    async function loadUrls() {
        const response = await fetch("/api/urls");
        const urls = await response.json();

        urlTable.innerHTML = "";

        urls.forEach(url => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${url.originalUrl}</td>
                <td>
                    <a href="/${url.shortCode}" target="_blank">
                        http://localhost:8080/${url.shortCode}
                    </a>
                </td>
                <td>${url.clickCount}</td>
                <td>
                    <button onclick="showAnalytics('${url.shortCode}')">
                        View
                    </button>
                </td>
            `;

            urlTable.appendChild(row);
        });
    }

    async function showAnalytics(shortCode) {
        const response =
            await fetch(`/api/analytics/${shortCode}`);

        const data = await response.json();

        alert(
            `Short Code: ${data.shortCode}\n` +
            `Clicks: ${data.clickCount}\n` +
            `Created: ${data.createdAt}\n` +
            `Last Accessed: ${data.lastAccessedAt}`
        );
    }

    loadUrls();
</script>

</body>
</html>
